name: CI

# Every push, plus every pull request aimed at main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ci, not install: it installs exactly what package-lock.json pins, so the
      # robot runs the versions you ran.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test
